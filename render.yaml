# Render Blueprint — deploy the UTSAVX API
# Dashboard: New → Blueprint → connect utsav262/utsavx
# Or create a Web Service manually using the values below.

services:
  - type: web
    name: utsavx-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: HOLD_TTL_MINUTES
        value: 15
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ALLOW_DEMO_PAYMENTS
        value: "false"
